name: עדכון חדשות ופרסום

on:
  schedule:
    # כל 30 דקות. GitHub מריץ לפי UTC, אבל התדירות היא מה שקובע כאן.
    - cron: '*/30 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# ריצה אחת בכל רגע נתון. ריצה חדשה מבטלת ישנה שנתקעה, אחרת תקיעה אחת
# חוסמת את כל העדכונים עד לתום שש שעות הפסק-זמן של GitHub.
concurrency:
  group: feed
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: התקנת חבילות
        run: |
          npm ci
          npm ci --prefix web

      - name: משיכת חדשות ובניית האתר
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run build

      # GitHub מכבה תזמון במאגר שאין בו פעילות במשך שישים יום, וזה מה שקרה כאן
      # ב-11 בנובמבר. קומיט ריק אחת לכמה שבועות מאפס את השעון. התנאי הכרחי:
      # בלעדיו היו נוצרים כאן קומיטים בכל ריצה, כלומר אלפים בחודש.
      - name: שמירה על התזמון פעיל
        if: github.event_name == 'schedule'
        run: |
          days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "הקומיט האחרון נעשה לפני $days ימים"
          if [ "$days" -ge 45 ]; then
            git config user.name "news-bot"
            git config user.email "news-bot@users.noreply.github.com"
            git commit --allow-empty -m "שמירה על התזמון פעיל"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
